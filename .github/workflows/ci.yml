name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/pytest -q

      - name: Run Ruff
        run: .venv/bin/ruff check .

      - name: Run mypy
        run: .venv/bin/mypy src

      - name: Run Pyright
        run: .venv/bin/pyright

      - name: Build and inspect distributions
        run: |
          .venv/bin/python -m build --outdir "$RUNNER_TEMP/panos-distributions"
          .venv/bin/python scripts/check_distributions.py "$RUNNER_TEMP/panos-distributions"

      - name: Smoke test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/panos-wheel-venv"
          "$RUNNER_TEMP/panos-wheel-venv/bin/python" -m pip install "$RUNNER_TEMP/panos-distributions/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/panos-wheel-venv/bin/panos-tunnel-builder" --help > /dev/null
