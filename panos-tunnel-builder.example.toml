# Environment variables override matching values in this section.
[panorama]
host = "panorama.example.com"
api_key = "replace-with-api-key"
port = 443
verify_ssl = true
# Optional PEM CA bundle for a private CA; relative paths use the working directory.
# ca_bundle = "/path/to/ca-bundle.pem"

[build]
spoke_firewall = "branch-01"
# Use exact template names, or the menu-number alternatives below.
spoke_template_name = "branch-network"
hub_firewall = "hub-01"
hub_template_name = "hub-network"
# spoke_template_menu_number = 2
# hub_template_menu_number = 2
# Set a name OR a menu number for each endpoint, not both.
spoke_vsys = "vsys1"
hub_vsys = "vsys1"
# Optional: rename each migrated spoke's existing legacy virtual router.
# Hub router names are preserved; matching spoke names require no rename.
# spoke_virtual_router_name = "Branch VR"
tunnel_address_pool = "10.254.0.0/24"
migration_artifact_directory = "migration-snapshots"
show_secrets = false
load_candidate = false
allow_pending_candidate_changes = false
# Accept confirmations and gateway mismatches; missing inputs still prompt.
skip_confirmation = false

[routes.snapshot]
firewall = "branch-01"
output_file = "branch-01-routes.json"
vsys = "vsys1"
overwrite_existing_file = false

[routes.compare]
before = "before.json"
after = "after.json"
prefix_map = ["10.0.0.0/30=10.1.0.0/30"]
interface_map = ["tunnel.2=tunnel.3"]
next_hop_map = ["10.0.0.1=10.1.0.1"]
# virtual_router_map = ["default=Branch VR"]

[routes.verify-migration]
manifest_file = "migration-validation.json"
output_directory = "migration-snapshots"

[candidate.restore]
# Name of a saved configuration on Panorama, not a local file.
snapshot_name = "LSVPN_PRE_example.xml"
skip_confirmation = false
