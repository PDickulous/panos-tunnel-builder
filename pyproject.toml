[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "panos-tunnel-builder"
version = "0.1.0"
description = "Build and manage PAN-OS tunnels through Panorama."
readme = "README-pypi.md"
requires-python = ">=3.12"
dependencies = [
    "pan-os-python>=1.13.1,<2",
    "python-dotenv>=1.2.2,<2",
    "typer>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=2.3,<3",
    "pyright>=1.1.411,<2",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.1,<0.17",
]

[project.urls]
Repository = "https://github.com/PDickulous/panos-tunnel-builder"
Documentation = "https://github.com/PDickulous/panos-tunnel-builder/tree/main/docs"

[project.scripts]
panos-tunnel-builder = "panos_tunnel_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["panos.*"]
ignore_missing_imports = true
